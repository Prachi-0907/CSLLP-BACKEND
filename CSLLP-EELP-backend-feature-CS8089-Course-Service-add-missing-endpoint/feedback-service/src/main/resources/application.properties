# application.properties
spring.application.name=feedback-service
server.port=8087
eureka.client.service-url.defaultZone=http://localhost:5050/eureka

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/feedback_service_db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# External Service URLs
user.service.url=http://localhost:8081
course.service.url=http://localhost:8090
exam.service.url=http://localhost:8083
material.service.url=http://localhost:8082
notification.service.url=http://localhost:8089/api/notifications/send-email

# Logging
logging.level.com.configserverllp.csllp_learning_platform.feedback_service=DEBUG