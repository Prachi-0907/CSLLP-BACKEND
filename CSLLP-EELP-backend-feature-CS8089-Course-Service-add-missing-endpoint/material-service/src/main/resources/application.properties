spring.application.name=material-service

# ===============================
# Application Configuration
# ===============================
server.port=8082

# ===============================
# DataSource Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/material_service_db
spring.datasource.username=root
spring.datasource.password=root

# ===============================
# Hibernate / JPA Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===============================
# File Storage Configuration
# ===============================
# Base directory for storing materials (change this path as per your system)

#commented out because we can then use any path to upload the materials
#material.upload.base-dir=D:/csllp-materials


# Subfolders inside base directory
material.upload.videos-dir=${material.upload.base-dir}/videos
material.upload.docs-dir=${material.upload.base-dir}/documents
material.upload.pdfs-dir=${material.upload.base-dir}/pdfs
material.upload.links-dir=${material.upload.base-dir}/links

# ===============================
# Multipart Configuration (for large files)
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=800MB
spring.servlet.multipart.max-request-size=800MB

# User service base (used to validate uploader)
user.service.base-url=http://localhost:8081

# ===============================
# Logging
# ===============================
logging.level.org.springframework=INFO
logging.level.com.configserverllp.csllp_learning_platform.material_service=DEBUG
